<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique — Plateforme avicole</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
  <script type="module" src="/js/pages/historique.js"></script>
</head>
<!-- /pages/historique.html?bande=12 — history of one Bande.
     /pages/historique.html          — "Historique général": everything (deleted Bandes, account…). -->
<body data-page="historique">
  <main id="contenu" class="contenu">
    <div class="titre-page">
      <div>
        <h1>Historique</h1>
        <p class="sous-titre" id="sous-titre"></p>
      </div>
      <div class="actions-page no-print">
        <button type="button" class="bouton" id="bouton-imprimer-page">Imprimer</button>
        <button type="button" class="bouton bouton-danger" id="bouton-effacer-tout">Effacer tout l’historique</button>
      </div>
    </div>
    <div id="message" aria-live="polite"></div>

    <section class="carte filtres-historique no-print" aria-label="Filtres">
      <form id="filtres" novalidate>
        <div class="champ">
          <label for="filtre-du">Du</label>
          <input id="filtre-du" name="du" type="date">
        </div>
        <div class="champ">
          <label for="filtre-au">Au</label>
          <input id="filtre-au" name="au" type="date">
        </div>
        <div class="champ">
          <label for="filtre-module">Section</label>
          <select id="filtre-module" name="module">
            <option value="">Toutes les sections</option>
            <option value="bandes">Bandes</option>
            <option value="volaille">Mortalité et malades</option>
            <option value="croissance">Croissance et pesées</option>
            <option value="charges">Charges</option>
            <option value="ventes">Ventes</option>
            <option value="employes">Employés</option>
            <option value="vehicules">Véhicules</option>
            <option value="parametres">Paramètres</option>
          </select>
        </div>
        <div class="champ">
          <label for="filtre-action">Action</label>
          <select id="filtre-action" name="action">
            <option value="">Toutes les actions</option>
            <option value="creation">Ajout</option>
            <option value="modification">Modification</option>
            <option value="suppression">Suppression / annulation</option>
          </select>
        </div>
        <div class="champ champ-large">
          <label for="filtre-q">Rechercher</label>
          <input id="filtre-q" name="q" type="search" placeholder="Ex. Ahmed, aliment, guérisons…">
        </div>
        <button type="button" class="bouton bouton-secondaire" id="bouton-effacer">Effacer les filtres</button>
      </form>
    </section>

    <section class="carte" aria-labelledby="titre-liste">
      <div class="titre-section">
        <h2 id="titre-liste">Opérations</h2>
        <span class="texte-discret" id="compte-resultats"></span>
      </div>
      <p class="seulement-impression texte-discret" id="filtres-imprimes"></p>
      <div id="liste">Chargement…</div>
      <div class="plus no-print"><button type="button" class="bouton bouton-secondaire" id="bouton-plus" hidden>Afficher plus</button></div>
    </section>
  </main>
</body>
</html>
