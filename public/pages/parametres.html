<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paramètres — Plateforme avicole</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
  <script type="module" src="/js/pages/parametres.js"></script>
</head>
<body data-page="parametres">
  <main id="contenu" class="contenu">
    <h1>Paramètres</h1>

    <section class="carte formulaire-etroit" aria-labelledby="titre-mdp">
      <h2 id="titre-mdp">Changer le mot de passe</h2>
      <div id="message" aria-live="polite"></div>

      <form id="formulaire-mdp" novalidate>
        <div class="champ">
          <label for="actuel">Mot de passe actuel</label>
          <div class="mot-de-passe-groupe">
            <input id="actuel" type="password" autocomplete="current-password" required>
            <button type="button" class="bouton bouton-secondaire" data-basculer="actuel">Afficher</button>
          </div>
        </div>

        <div class="champ">
          <label for="nouveau">Nouveau mot de passe</label>
          <div class="mot-de-passe-groupe">
            <input id="nouveau" type="password" autocomplete="new-password" required aria-describedby="regles">
            <button type="button" class="bouton bouton-secondaire" data-basculer="nouveau">Afficher</button>
          </div>
        </div>
        <ul class="regles" id="regles">
          <li data-regle="longueur">Au moins 10 caractères</li>
          <li data-regle="minuscule">Une lettre minuscule</li>
          <li data-regle="majuscule">Une lettre majuscule</li>
          <li data-regle="chiffre">Un chiffre</li>
          <li data-regle="special">Un caractère spécial (ex. ! @ # - _)</li>
        </ul>

        <div class="champ">
          <label for="confirmation">Confirmer le nouveau mot de passe</label>
          <div class="mot-de-passe-groupe">
            <input id="confirmation" type="password" autocomplete="new-password" required>
            <button type="button" class="bouton bouton-secondaire" data-basculer="confirmation">Afficher</button>
          </div>
        </div>

        <button type="submit" class="bouton" id="bouton-enregistrer">Enregistrer le nouveau mot de passe</button>
      </form>
    </section>
  </main>
</body>
</html>
